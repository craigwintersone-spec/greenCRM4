<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Vorlana — Settings</title>
<link rel="icon" type="image/png" href="logo-mark.png"/>
<script>
  // Settings now live inside the app (Settings in the menu). This old
  // page just forwards there, keeping the organisation from the link.
  (function () {
    var q = new URLSearchParams(location.search);
    var org = q.get('org_id') || q.get('org');
    location.replace('app.html?' + (org ? 'org_id=' + encodeURIComponent(org) + '&' : '') + 'page=settings');
  })();
</script>
</head>
<body style="font-family:system-ui,sans-serif;padding:40px;text-align:center;color:#44504F">
  <p>Settings have moved into the app. <a href="app.html?page=settings">Open Settings</a>.</p>
</body>
</html>
